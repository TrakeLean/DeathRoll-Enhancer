name: Verify and release addon

on:
  push:
    branches: [main]
    paths: [VERSION, .github/workflows/release.yml]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addon-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Build installable archive
        run: |
          version=$(cat VERSION)
          python scripts/build_release.py --version "$version" --output "dist/DeathRollEnhancer-$version.zip"

  release:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build verified revision and extract release notes
        run: |
          version=$(cat VERSION)
          python3 scripts/build_release.py --version "$version" --output "dist/DeathRollEnhancer-$version.zip"
          python3 - <<'PY'
          from pathlib import Path
          import re
          version = Path('VERSION').read_text().strip()
          changes = Path('CHANGELOG.md').read_text()
          heading = f'## {version} '
          if not changes.startswith(heading):
              raise SystemExit('Changelog must start with this release version')
          notes = re.split(r'\n(?:## |# DeathRoll Enhancer - Changelog)', changes, maxsplit=1)[0]
          Path('dist/release-notes.md').write_text(notes)
          PY
      - name: Publish version tag and installable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          gh release create "v$version" "dist/DeathRollEnhancer-$version.zip" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "DeathRoll Enhancer $version - 2SChoppy Edition" --notes-file dist/release-notes.md
