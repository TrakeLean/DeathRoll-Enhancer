name: Verify and release addon

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addon-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Build installable archive
        run: |
          version=$(cat VERSION)
          python scripts/build_release.py --version "$version" --output "dist/DeathRollEnhancer-$version.zip"

  release:
    needs: verify
    if: github.event_name == 'push' && github.event.created && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check the pushed tag against VERSION
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Build verified revision and extract release notes
        run: |
          version=$(cat VERSION)
          python3 scripts/build_release.py --version "$version" --output "dist/DeathRollEnhancer-$version.zip"
          python3 - <<'PY'
          from pathlib import Path
          import re
          version = Path('VERSION').read_text(encoding='utf-8').strip()
          changes = Path('CHANGELOG.md').read_text(encoding='utf-8')
          heading = f'## {version} '
          if not changes.startswith(heading):
              raise SystemExit('Changelog must start with this release version')
          notes = re.split(r'\n(?:## |# DeathRoll Enhancer - Changelog)', changes, maxsplit=1)[0]
          Path('dist/release-notes.md').write_text(notes, encoding='utf-8')
          PY
      - name: Attach the installable ZIP to the tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          flags=()
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "v$version" "dist/DeathRollEnhancer-$version.zip" "${flags[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "DeathRoll Enhancer $version - 2SChoppy Edition" --notes-file dist/release-notes.md
